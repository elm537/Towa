<div id="fade-overlay"></div>
    
    <script>
        const imgBtn = document.getElementById('clickable-img');
        const overlay = document.getElementById('fade-overlay');

        if (imgBtn && overlay) {
            imgBtn.addEventListener('click', function() {
                overlay.classList.add('show'); // 触发变黑
                
                setTimeout(function() {
                    window.location.href = 'next2.html'; // 0.5秒后跳转

            });
