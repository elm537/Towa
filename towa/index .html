<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>来自slow damage艺术家Euphoria的邀请</title>
    <style>  
      body {
        margin: 0;
      }
      </style>
      <style>
    body {
        margin: 0;
        padding: 0%;
        width: 100%;
        height: 100%;
        background-color: black;
    }

    /* ===== 新增的转场黑幕样式 ===== */
    #fade-overlay {
        position: fixed;       /* 固定在屏幕上 */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 0;            /* 初始透明，看不见 */
        pointer-events: none;  /* 默认不挡住鼠标点击 */
        transition: opacity 0.5s ease; /* 0.5秒平滑过渡 */
        z-index: 9999;         /* 保证在最上层 */
    }
    /* 当 JS 加上 show 这个类名时，变成不透明（全黑） */
    #fade-overlay.show {
        opacity: 1;
        pointer-events: auto;
    }
    /* ============================== */

</style>
    </style>
  </head>
  <body>
    <div style="
      background-color:black;
      text-align:center;
      padding:20px";
      max-width:700px;
      margin:30px auto;
    padding:30px>
  <font size="5"><b><font color="FFFFF">--来自艺术家</font><font color="FF000">Euphoria</font><font color="FFFFF">的邀请--</b></font>
    </div>
  <div style="
  background-color:black;
  text-align:center;
  padding:40px;
  ">
<img src="images/towadraw.png"alt="towa"width="768"height="480">
  </div>
  <div style="
  background-color:black;
  margin:0px auto;
  text-align:center;
  padding:15px;
  line-height:2;
  ">
  <font color="FFFFF"><font size="5">
    <p>夜深人静,你决定前往Roost挥霍时间</p>
    <p>你呆呆的摇晃着威士忌中的冰块，看到吧台前有一位独酌的艺术家</p>
    <p>你决定和他聊聊</p>
    <p><a href="next.html" class="go-btn" id="go-btn">--> 前往画廊</a></p>
  </div>
  <!-- 1. 黑幕元素 -->
<div id="fade-overlay"></div>

<!-- 2. JS 控制代码 -->
<script>
    const overlay = document.getElementById('fade-overlay');
    const btn = document.getElementById('go-btn'); 

    btn.addEventListener('click', function(event) {
        // 阻止默认的瞬间跳转
        event.preventDefault(); 

        // 页面开始变黑
        overlay.classList.add('show');

        // 等待 0.5 秒后跳转
        setTimeout(function() {
            window.location.href = 'next.html';
        }, 500); 
    });
</script>
  </body>
</html>
