<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>作画</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .big-text {
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            font-size: 8vw;
            font-weight: bold;
            letter-spacing: 5px;
            text-align: center;
            padding: 0 20px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.5s ease, transform 1.5s ease;
            z-index: 2;
        }

        .big-text.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <video id="my-video" src="video/Towa.mp4" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"></video>

    <div class="big-text" id="main-text">
        接下来…该让我为你作画了
    </div>

    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; opacity: 1; transition: opacity 1s ease; z-index: 9999; pointer-events: none;"></div>

    <audio id="page-bgm" src="audio/towavoice.mp3"></audio>

    <script>
        window.addEventListener('load', function() {
            const overlay = document.getElementById('fade-overlay');
            const video = document.getElementById('my-video');
            const bigText = document.getElementById('main-text');
            const audio = document.getElementById('page-bgm');

            setTimeout(function() {
                overlay.style.opacity = '0'; 
            }, 100);

            video.play().catch(e => console.log("视频自动播放被拦截"));

            video.addEventListener('ended', function() {
                
                audio.play().catch(e => console.log("音频自动播放被拦截"));
                bigText.classList.add('show');

            });

            audio.addEventListener('ended', function() {
                
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';

            });

        });
    </script>

</body>
</html>
